<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peli</title>
    <link rel="stylesheet" href="pelidesign.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.4/dist/leaflet.css"
    />
    <script type="importmap">
      {
        "imports": {
          "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.4/dist/leaflet.js"
        }
      }
    </script>
  </head>
  <body>
    <div>
      <!--TODO: siirtää stylet css tiedostoon-->
      <div
        id="map"
        style="position: absolute; width: 100vw; height: 100vh"
      ></div>

      <!--tavaraa keskellä ruutua kuten mainmenu, asetukset jne-->
      <div id="alotusnäyttö" class="keskellä">
        <h1>lentopeli</h1>
        <button id="btn1">Aloitapeli</button>
        <button id="btn2">Vaikeustaso</button>
        <button id="btn3">Asetukset</button>
      </div>
      <div id="valitsealoituslentokenttä" class="keskellä">
        <h1>valitse aloitus lentokenttä</h1>
        <div id="kentät">Ladataan...</div>
      </div>
      <div id="Asetukset" class="keskellä">
        <h1>Asetukset</h1>
        <button id="btn1">Takaisin</button>
        <button id="btn2">Ääni</button>
      </div>
      <div id="Vaikeustaso" class="keskellä">
        <h1>Vaikeustaso</h1>
        <button id="btn1">Helppo</button>
        <button id="btn2">Vaikea</button>
      </div>

      <!--tavaraa alhaalla ruutua kuten kysymykset jne-->
      <div id="kysymykset" class="kysymys">
        <h1>lentopeli</h1>
        <button id="btn1"></button>
        <button id="btn2"></button>
        <button id="btn3"></button>
        <button id="btn4"></button>
      </div>
    </div>

    <!--leafletin käyttö vaatii "module" typen käyttöä (eli import export jne toimivat vain tämän kanssa)-->
    <script type="module" src="pelikoodi.js"></script>
  </body>
</html>
